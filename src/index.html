<!doctype html>
<html lang="de">
  <head>
    <!-- Base -->
    <meta charset="utf-8" />
    <title>TrackThat</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/x-icon" href="assets/icon/favicon.ico" />

    <!-- add to homescreen for ios -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrackThat" />

    <!-- Single-Sign-On - Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- App initializion loading styles -->
    <style>
      :root {
        --app-loader-color: var(--ion-color-primary);
        --app-loader-track: #e9ecef;
        --app-init-overlay-fade-duration: 300ms;

        @media (prefers-color-scheme: dark) {
          --app-loader-track: #343435;
        }
      }

      .app-init-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 1;
        background: var(--ion-color-light);

        opacity: 1;
        visibility: visible;
        transition:
          opacity var(--app-init-overlay-fade-duration) ease,
          visibility 0ms linear var(--app-init-overlay-fade-duration);
      }

      .app-init-overlay--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .app-init-overlay-logo {
        width: 128px;
        height: 128px;
        object-fit: contain;
        content: url('/assets/icons/logo-white.png');

        @media (prefers-color-scheme: dark) {
          content: url('/assets/icons/logo-black.png');
        }
      }

      .progress {
        position: relative;
        overflow: hidden;
        width: 200px;
        height: 6px;
        background-color: var(--app-loader-track);
        border-radius: 999px;

        opacity: 0;
        animation: show-progress 200ms ease 1s forwards;
      }

      .progress-bar {
        position: absolute;
        inset-block: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--app-loader-color);
        animation: app-loader-progress 1.1s ease-in-out infinite;
      }

      @keyframes show-progress {
        to {
          opacity: 1;
        }
      }

      @keyframes app-loader-progress {
        0% {
          left: -40%;
        }

        100% {
          left: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div id="app-init-overlay" class="app-init-overlay">
      <img class="app-init-overlay-logo" alt="TrackThat" />
      <div class="progress" aria-label="App wird geladen">
        <div class="progress-bar"></div>
      </div>
    </div>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
